name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNFACTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/synfactory_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Verify reproducible web dependencies
        run: |
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund'
          git diff --exit-code -- web/package-lock.json

      - name: Frontend dependency audit
        run: |
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm audit --audit-level=high --omit=dev'

      - name: Validate operations scripts
        run: bash -n scripts/backup.sh scripts/restore.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config/runtimes.example.json config/runtimes.local.json
          docker compose --profile local-db config >/dev/null

      - name: Build control image
        run: docker build --target control -t synfactory-control:ci .

      - name: Build worker image
        run: docker build --target worker -t synfactory-worker:ci .

      - name: Build web control center image
        run: docker build -t synfactory-web:ci ./web

      - name: Scan control image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: synfactory-control:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: synfactory-worker:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: synfactory-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Prepare release evidence directory
        run: mkdir -p release-evidence

      - name: Generate control SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: synfactory-control:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/control.cdx.json
          exit-code: '0'

      - name: Generate worker SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: synfactory-worker:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/worker.cdx.json
          exit-code: '0'

      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: synfactory-web:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/web.cdx.json
          exit-code: '0'

      - name: Record exact-head release manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg control_image_id "$(docker image inspect synfactory-control:ci --format '{{.Id}}')" \
            --arg worker_image_id "$(docker image inspect synfactory-worker:ci --format '{{.Id}}')" \
            --arg web_image_id "$(docker image inspect synfactory-web:ci --format '{{.Id}}')" \
            '{source_sha:$source_sha,images:{control:{local_id:$control_image_id},worker:{local_id:$worker_image_id},web:{local_id:$web_image_id}}}' \
            > release-evidence/manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
