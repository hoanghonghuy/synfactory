name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNFACTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/synfactory_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Go vulnerability scan
        timeout-minutes: 10
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Verify reproducible web dependencies
        timeout-minutes: 8
        run: |
          docker run --rm \
            -v "$PWD/web/package.json:/app/package.json:ro" \
            -v "$PWD/web/package-lock.json:/app/package-lock.json:ro" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund'

      - name: Scan frontend dependencies
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: web
          scanners: vuln
          vuln-type: library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Validate operations scripts
        run: bash -n scripts/backup.sh scripts/restore.sh scripts/preflight.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config/runtimes.example.json config/runtimes.local.json
          docker compose --profile local-db config >/dev/null

      - name: Verify launch preflight
        run: |
          if bash scripts/preflight.sh .env.example; then
            echo "example placeholders must not pass production preflight" >&2
            exit 1
          fi
          cp .env.example "$RUNNER_TEMP/preflight.env"
          sed -i \
            -e 's/factory.example.com/factory.test/' \
            -e 's/replace-with-a-long-random-password/test-database-password/g' \
            -e 's/replace-with-fine-grained-pat-when-using-pat-mode/test-github-token/' \
            -e 's/replace-with-webhook-secret/test-webhook-secret/' \
            -e 's/replace-with-a-long-random-operator-token/test-operator-token/' \
            -e "s|^SYNFACTORY_REPOSITORY_ROOT=.*|SYNFACTORY_REPOSITORY_ROOT=$RUNNER_TEMP/repos|" \
            -e "s|^SYNFACTORY_WORKSPACE_ROOT=.*|SYNFACTORY_WORKSPACE_ROOT=$RUNNER_TEMP/workspaces|" \
            -e "s|^SYNFACTORY_AGENT_BIN=.*|SYNFACTORY_AGENT_BIN=$RUNNER_TEMP/agent-bin|" \
            -e "s|^SYNFACTORY_AGENT_HOME=.*|SYNFACTORY_AGENT_HOME=$RUNNER_TEMP/agent-home|" \
            "$RUNNER_TEMP/preflight.env"
          mkdir -p "$RUNNER_TEMP/repos" "$RUNNER_TEMP/workspaces" "$RUNNER_TEMP/agent-bin" "$RUNNER_TEMP/agent-home"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$RUNNER_TEMP/agent-bin/codex"
          chmod +x "$RUNNER_TEMP/agent-bin/codex"
          bash scripts/preflight.sh "$RUNNER_TEMP/preflight.env"

          cp "$RUNNER_TEMP/preflight.env" "$RUNNER_TEMP/preflight-app.env"
          printf '%s\n' 'test-private-key-material' > "$RUNNER_TEMP/github-app.pem"
          sed -i \
            -e 's/^SYNFACTORY_GITHUB_AUTH_MODE=pat$/SYNFACTORY_GITHUB_AUTH_MODE=app/' \
            -e 's/^SYNFACTORY_GITHUB_APP_ID=$/SYNFACTORY_GITHUB_APP_ID=12345/' \
            -e "s|^SYNFACTORY_GITHUB_APP_PRIVATE_KEY_HOST=.*|SYNFACTORY_GITHUB_APP_PRIVATE_KEY_HOST=$RUNNER_TEMP/github-app.pem|" \
            "$RUNNER_TEMP/preflight-app.env"
          bash scripts/preflight.sh "$RUNNER_TEMP/preflight-app.env"

      - name: Build control image
        run: docker build --target control -t synfactory-control:ci .

      - name: Build worker image
        run: docker build --target worker -t synfactory-worker:ci .

      - name: Build web control center image
        run: docker build -t synfactory-web:ci ./web

      - name: Scan control image
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: synfactory-control:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Scan worker image
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: synfactory-worker:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Scan web image
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: synfactory-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'

      - name: Prepare release evidence directory
        run: mkdir -p release-evidence

      - name: Export scanned release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        timeout-minutes: 10
        run: |
          mkdir -p release-evidence/images
          docker image save -o release-evidence/images/control.tar synfactory-control:ci
          docker image save -o release-evidence/images/worker.tar synfactory-worker:ci
          docker image save -o release-evidence/images/web.tar synfactory-web:ci

      - name: Generate control SBOM
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: synfactory-control:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/control.cdx.json
          exit-code: '0'

      - name: Generate worker SBOM
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: synfactory-worker:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/worker.cdx.json
          exit-code: '0'

      - name: Generate web SBOM
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: synfactory-web:ci
          scan-type: image
          format: cyclonedx
          output: release-evidence/web.cdx.json
          exit-code: '0'

      - name: Record exact-head release manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_READY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          control_archive_path=""
          worker_archive_path=""
          web_archive_path=""
          control_archive_sha256=""
          worker_archive_sha256=""
          web_archive_sha256=""
          if [ "$RELEASE_READY" = "true" ]; then
            control_archive_path="images/control.tar"
            worker_archive_path="images/worker.tar"
            web_archive_path="images/web.tar"
            control_archive_sha256="$(sha256sum release-evidence/images/control.tar | awk '{print $1}')"
            worker_archive_sha256="$(sha256sum release-evidence/images/worker.tar | awk '{print $1}')"
            web_archive_sha256="$(sha256sum release-evidence/images/web.tar | awk '{print $1}')"
          fi
          jq -n \
            --argjson release_ready "$RELEASE_READY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg web_lock_sha256 "$(sha256sum web/package-lock.json | awk '{print $1}')" \
            --arg control_image_id "$(docker image inspect synfactory-control:ci --format '{{.Id}}')" \
            --arg worker_image_id "$(docker image inspect synfactory-worker:ci --format '{{.Id}}')" \
            --arg web_image_id "$(docker image inspect synfactory-web:ci --format '{{.Id}}')" \
            --arg control_archive_path "$control_archive_path" \
            --arg worker_archive_path "$worker_archive_path" \
            --arg web_archive_path "$web_archive_path" \
            --arg control_archive_sha256 "$control_archive_sha256" \
            --arg worker_archive_sha256 "$worker_archive_sha256" \
            --arg web_archive_sha256 "$web_archive_sha256" \
            --arg control_sbom_sha256 "$(sha256sum release-evidence/control.cdx.json | awk '{print $1}')" \
            --arg worker_sbom_sha256 "$(sha256sum release-evidence/worker.cdx.json | awk '{print $1}')" \
            --arg web_sbom_sha256 "$(sha256sum release-evidence/web.cdx.json | awk '{print $1}')" \
            '{release_ready:$release_ready,source_sha:$source_sha,web_lock_sha256:$web_lock_sha256,scanners:{govulncheck:"v1.7.0",trivy:"v0.70.0"},gates:{go_vulnerability:"passed",frontend_dependency:"passed",control_image:"passed",worker_image:"passed",web_image:"passed"},images:{control:{local_id:$control_image_id,archive_path:$control_archive_path,archive_sha256:$control_archive_sha256},worker:{local_id:$worker_image_id,archive_path:$worker_archive_path,archive_sha256:$worker_archive_sha256},web:{local_id:$web_image_id,archive_path:$web_archive_path,archive_sha256:$web_archive_sha256}},sboms:{control:{path:"control.cdx.json",sha256:$control_sbom_sha256},worker:{path:"worker.cdx.json",sha256:$worker_sbom_sha256},web:{path:"web.cdx.json",sha256:$web_sbom_sha256}}}' \
            > release-evidence/manifest.json

      - name: Upload release evidence metadata
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-evidence/
            !release-evidence/images/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload release-ready image bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7
