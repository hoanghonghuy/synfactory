name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNFACTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/synfactory_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Validate operations scripts
        run: bash -n scripts/backup.sh scripts/restore.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config/runtimes.example.json config/runtimes.local.json
          docker compose --profile local-db config >/dev/null

      - name: Build control image
        run: docker build --target control -t synfactory-control:ci .

      - name: Build worker image
        run: docker build --target worker -t synfactory-worker:ci .

      - name: Build web control center image
        run: docker build -t synfactory-web:ci ./web
