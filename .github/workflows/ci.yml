name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNFACTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/synfactory_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        id: format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            mkdir -p .ci/gofmt
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              gofmt -w "$file"
              mkdir -p ".ci/gofmt/$(dirname "$file")"
              cp "$file" ".ci/gofmt/$file"
            done <<< "$unformatted"
            echo "gofmt diff:"
            git diff -- $unformatted
            exit 1
          fi

      - name: Upload gofmt output
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-output
          path: .ci/gofmt
          if-no-files-found: error

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate operations scripts
        run: bash -n scripts/backup.sh scripts/restore.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config/runtimes.example.json config/runtimes.local.json
          docker compose --profile local-db config >/dev/null

      - name: Build control image
        run: docker build --target control -t synfactory-control:ci .

      - name: Build worker image
        run: docker build --target worker -t synfactory-worker:ci .

      - name: Build web control center image
        run: docker build -t synfactory-web:ci ./web
