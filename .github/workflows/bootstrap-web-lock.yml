name: Bootstrap web lockfile

on:
  pull_request:
    paths:
      - web/package.json
      - web/package-lock.json
      - .github/workflows/bootstrap-web-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Generate package lock with production Node image
        run: |
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund'

      - name: Verify lockfile
        run: |
          test -s web/package-lock.json
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund'

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "package-lock.json is already reproducible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build: commit reproducible web dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
