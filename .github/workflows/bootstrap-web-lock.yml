name: Bootstrap web lockfile

on:
  pull_request:
    paths:
      - web/package.json
      - .github/workflows/bootstrap-web-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate package lock with production Node image
        run: |
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund'

      - name: Verify lockfile
        run: |
          test -s web/package-lock.json
          docker run --rm \
            -v "$PWD/web:/app" \
            -w /app \
            node:24-alpine \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund'

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1
